AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Shop backend - serverless API on AWS Lambda and API Gateway

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    CodeUri: src/
    Environment:
      Variables:
        STAGE: !Ref Stage
        LOG_LEVEL: INFO
        PRODUCTS_TABLE: !Ref ProductsTable

Resources:
  ProductsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub shop-products-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ShopApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: shop.handlers.health.handler
      Description: Health check endpoint
      Events:
        GetHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShopApi
            Path: /health
            Method: GET

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the shop API
    Value: !Sub https://${ShopApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  ProductsTableName:
    Description: Name of the DynamoDB products table
    Value: !Ref ProductsTable
