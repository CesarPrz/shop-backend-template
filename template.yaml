AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Shop backend - serverless API on AWS Lambda and API Gateway

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    CodeUri: src/
    Environment:
      Variables:
        STAGE: !Ref Stage
        LOG_LEVEL: INFO
        PRODUCTS_TABLE: !Ref ProductsTable

Resources:
  ProductsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub shop-products-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ShopApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: shop.handlers.health.handler
      Description: Health check endpoint
      Events:
        GetHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShopApi
            Path: /health
            Method: GET

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${HealthFunction}
      RetentionInDays: 14

  ListProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: shop.handlers.products.list_products
      Description: List products
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
      Events:
        ListProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShopApi
            Path: /products
            Method: GET

  ListProductsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ListProductsFunction}
      RetentionInDays: 14

  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: shop.handlers.products.get_product
      Description: Get a product by id
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
      Events:
        GetProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShopApi
            Path: /products/{productId}
            Method: GET

  GetProductFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetProductFunction}
      RetentionInDays: 14

  CreateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: shop.handlers.products.create_product
      Description: Create a product
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      Events:
        CreateProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShopApi
            Path: /products
            Method: POST

  CreateProductFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateProductFunction}
      RetentionInDays: 14

  UpdateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: shop.handlers.products.update_product
      Description: Update a product
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      Events:
        UpdateProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShopApi
            Path: /products/{productId}
            Method: PATCH

  UpdateProductFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${UpdateProductFunction}
      RetentionInDays: 14

  DeleteProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: shop.handlers.products.delete_product
      Description: Delete a product
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      Events:
        DeleteProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShopApi
            Path: /products/{productId}
            Method: DELETE

  DeleteProductFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DeleteProductFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the shop API
    Value: !Sub https://${ShopApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  ProductsTableName:
    Description: Name of the DynamoDB products table
    Value: !Ref ProductsTable
